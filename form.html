<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple HTML Form</title>
</head>
<body>
    <form action="/submit" method="post">
        <br><br>
        <label for="name">NAME:</label>
        <input type="text" id="name" name="name" required>
        </label>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1"><br><br>

        <label for="roll number">Roll Number:</label>
        <input type="text" id="roll number" name="roll number" required><br><br>
        
        <label for= "101"></label>
        <input type="radio" value="class10"  name="class" id="101">class 10
        </label>
        <input type="radio" value="class12" name="class" id="102">class 12
        </label><br><br>
        <label for="section">Section:

        </label>></label>
        <input type="text" id="section" name="section" required><br><br

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
